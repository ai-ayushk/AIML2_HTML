<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
</head>
<body>
    <fieldset>  
        <legend>BioData</legend>
        <form action="./respone.html">
            <label for="name">Username:</label>
            <input type="text" name="name" id="name" placeholder="Enter your name"><br><br>

            <label for="pass">Password:</label>
            <input type="password" name="pass" id="pass" placeholder="Enter your password"><br><br>

            <label for="date">Date Of Birth:</label>
            <input type="date" name="dob" id="dob"><br><br>
            
            <label for="gender">Gender:</label>
            <input type="radio" name="gender" id="gender">
            <label for="gender">Male</label>
            <input type="radio" name="gender" id="gender">
            <label for="gender">Female</label><br><br>

            <label for="hobb">Hobbies:</label>
            <input type="checkbox" name="hobb1" id="hobb"><label for="hobb">Cricket</label>
            <input type="checkbox" name="hobb2" id="hobb"><label for="hobb">Football</label><br><br>

            <label for="addr">Address:</label>
            <textarea name="addr" id="addr"></textarea><br><br>
            
            <label for="tel">Phone:</label>
            <input type="tel" id="tel" name="tel"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br><br>

            <label for="age">Attempt:</label>
            <input type="number" id="att" name="att"><br><br>

            <label for="url">Homepage:</label>
            <input type="url" id="url" name="url"><br><br>

            <label for="file">Resume Upload:</label>
            <input type="file" id="file" name="file"><br><br>

            <input type="submit" value="Submit">
            <input type="reset" value="Reset">

        </form>
    </fieldset>
</body>
</html>
